databases:
  - name: letter-to-bapa-db
    plan: free
    postgresMajorVersion: 16
    region: virginia

services:
  - type: web
    name: letter-to-bapa
    runtime: node
    plan: free
    region: virginia
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL
        fromDatabase:
          name: letter-to-bapa-db
          property: connectionString
      - key: ADMIN_KEY
        generateValue: true
